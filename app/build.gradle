plugins { id 'com.android.application' }

android {
    namespace 'com.duolinco.de'
    compileSdk 34

    defaultConfig {
        applicationId 'com.duolinco.de'
        minSdk 21
        targetSdk 29
        versionCode 3
        versionName '2.1.2'
    }
}

dependencies {}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
